<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Словари — JEREN EDUCATION</title>
  <meta name="description" content="Словари русского языка — JEREN EDUCATION">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-subpage="true" data-page="dictionaries" data-base="../">
  <div class="page-wrapper">
    <div id="site-header"></div>
    <main>
      <div class="page-header container">
        <h1 class="page-header__title" data-i18n="dictionaries.title">Словари</h1>
        <p class="page-header__subtitle" data-i18n="dictionaries.subtitle">Интеллектуальный поиск по словарям русского языка.</p>
      </div>
      <section class="section container">
        <div class="demo-note">
          <span class="badge badge--gold" data-i18n="common.demo">Демо</span>
          <span data-i18n="dictionaries.demoNote">Демонстрационная база. Полные словари будут подключены позже.</span>
        </div>
        <div class="grid grid--4 grid--gap-sm" style="margin-bottom:var(--space-8);">
          <span class="badge badge--muted" data-i18n="dictionaries.categories.explanatory">Толковый словарь</span>
          <span class="badge badge--muted" data-i18n="dictionaries.categories.stress">Словарь ударений</span>
          <span class="badge badge--muted" data-i18n="dictionaries.categories.phraseology">Фразеологизмы</span>
          <span class="badge badge--muted" data-i18n="dictionaries.categories.synonyms">Синонимы</span>
        </div>
        <div class="search-input">
          <svg class="search-input__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" class="search-input__field" id="dict-search" data-i18n-placeholder="dictionaries.search" placeholder="Введите слово...">
        </div>
        <div style="margin-top:var(--space-4);">
          <button class="btn btn--primary" id="dict-search-btn" data-i18n="common.search">Поиск</button>
        </div>
        <div id="dict-result"></div>
      </section>
    </main>
    <div id="site-footer"></div>
  </div>
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/pages/dictionaries.js"></script>
</body>
</html>
