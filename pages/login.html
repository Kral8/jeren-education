<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — JEREN EDUCATION</title>
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-subpage="true" data-page="login" data-base="../">
  <div class="page-wrapper">
    <div id="site-header"></div>
    <main>
      <section class="section container auth-screen">
        <div class="auth-card card card--glass">
          <div class="auth-card__brand">JEREN EDUCATION</div>
          <h1 class="auth-card__title" data-i18n="login.title">Добро пожаловать</h1>
          <p class="auth-card__subtitle" data-i18n="login.subtitle">Ваше пространство для работы, обучения и интеллектуальной поддержки.</p>

          <div class="auth-card__choices" id="auth-choices">
            <button type="button" class="btn btn--primary btn--full" id="btn-has-code" data-i18n="login.hasCode">У меня есть код</button>
            <button type="button" class="btn btn--secondary btn--full" id="btn-guest" data-i18n="login.guest">Войти как гость</button>
          </div>

          <form class="auth-card__form" id="auth-form" hidden>
            <label class="form-label" for="auth-code" data-i18n="login.codeLabel">Код доступа</label>
            <input type="text" class="form-input auth-card__input" id="auth-code" autocomplete="off" data-i18n-placeholder="login.codePlaceholder" placeholder="Введите код">
            <p class="auth-card__error" id="auth-error" hidden data-i18n="login.invalidCode"></p>
            <button type="submit" class="btn btn--primary btn--full" data-i18n="login.submit">Войти</button>
          </form>

          <p class="auth-card__note" data-i18n="login.guestNote">Гостевой режим: ограниченный доступ.</p>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
  </div>
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/pages/login.js"></script>
</body>
</html>
