<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход — JEREN EDUCATION</title>
  <meta name="description" content="Вход в JEREN EDUCATION">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-subpage="true" data-page="login" data-base="../">
  <div class="page-wrapper">
    <div id="site-header"></div>
    <main>
      <div class="page-header container">
        <h1 class="page-header__title" data-i18n="login.title">Вход</h1>
        <p class="page-header__subtitle" data-i18n="login.subtitle">Авторизация будет доступна в следующей версии платформы.</p>
      </div>
      <section class="section container container--narrow">
        <form class="card card--elevated" onsubmit="return false;">
          <div class="form-group">
            <label class="form-label" for="login-email" data-i18n="login.email">Email</label>
            <input type="email" class="form-input" id="login-email" disabled>
          </div>
          <div class="form-group">
            <label class="form-label" for="login-password" data-i18n="login.password">Пароль</label>
            <input type="password" class="form-input" id="login-password" disabled>
          </div>
          <button type="submit" class="btn btn--primary btn--full" disabled data-i18n="login.submit">Войти</button>
          <p class="demo-note" style="margin-top:var(--space-4);margin-bottom:0;" data-i18n="login.comingSoon">Система регистрации и личные кабинеты находятся в разработке.</p>
        </form>
      </section>
    </main>
    <div id="site-footer"></div>
  </div>
  <script type="module" src="../js/app.js"></script>
</body>
</html>
