<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ария — AI-помощник — JEREN EDUCATION</title>
  <meta name="description" content="Ария — AI-помощница JEREN EDUCATION для учителей">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/pages.css">
</head>
<body data-subpage="true" data-page="aria" data-base="../">
  <div class="page-wrapper">
    <div id="site-header"></div>
    <main class="aria-main container">
      <section class="aria-section">
        <div class="aria-chat card card--glass">
          <header class="aria-chat__header">
            <div class="aria-avatar" aria-hidden="true">А</div>
            <div class="aria-chat__meta">
              <div class="aria-chat__name" data-i18n="aria.title">Ария</div>
              <p class="aria-chat__subtitle" data-i18n="aria.subtitle">Виртуальная помощница для учителей и педагогов.</p>
              <div class="aria-chat__status" id="aria-status" data-i18n="aria.statusOnline">Онлайн</div>
            </div>
          </header>
          <div class="aria-quick-actions" id="aria-quick-actions" role="group" aria-label="Quick actions"></div>
          <div class="aria-chat__messages" id="aria-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
          <div class="aria-chat__input">
            <textarea class="form-input aria-chat__textarea" id="aria-input" rows="1" data-i18n-placeholder="aria.placeholder" placeholder="Задайте вопрос..." autocomplete="off"></textarea>
            <button class="btn btn--primary aria-chat__send" id="aria-send" type="button" data-i18n="aria.send">Отправить</button>
          </div>
        </div>
      </section>
    </main>
    <div id="site-footer"></div>
  </div>
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/pages/aria.js"></script>
</body>
</html>
