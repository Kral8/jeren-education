<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ария — AI-помощник — JEREN EDUCATION</title>
  <meta name="description" content="Ария — AI-помощница JEREN EDUCATION">
  <link rel="icon" href="../assets/icons/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/base.css">
  <link rel="stylesheet" href="../css/components.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/animations.css">

<body data-subpage="true" data-page="aria" data-base="../">
  <div class="page-wrapper">
    <div id="site-header"></div>
    <main>
      <div class="page-header container">
        <span class="badge badge--gold page-header__badge">AI</span>
        <h1 class="page-header__title" data-i18n="aria.title">Ария</h1>
        <p class="page-header__subtitle" data-i18n="aria.subtitle">AI-помощница образовательной платформы.</p>
      </div>
      <section class="section container">
        <div class="aria-chat">
          <div class="aria-chat__messages" id="aria-messages"></div>
          <div class="aria-chat__input">
            <input type="text" class="form-input" id="aria-input" data-i18n-placeholder="aria.placeholder" placeholder="Задайте вопрос...">
            <button class="btn btn--primary" id="aria-send" data-i18n="aria.send">Отправить</button>
          </div>
        </div>
        <p class="aria-disclaimer" id="aria-disclaimer" hidden data-i18n="aria.disclaimer">Ария — виртуальный помощник. Для полноценной работы AI требуется подключение backend API.</p>
        <p class="aria-disclaimer" data-i18n="aria.topics">Я могу помочь с русским языком, литературой, грамматикой, орфографией, курсовыми работами и подготовкой к тестам.</p>
      </section>
    </main>
    <div id="site-footer"></div>
  </div>
  <script type="module" src="../js/app.js"></script>
  <script type="module" src="../js/pages/aria.js"></script>
